name: Build Docker Images

on:
  push:
    branches: ["master"]
    paths:
      - "docker/**"
  pull_request:
    branches: ["master"]
    types:
      - closed
      - opened
      - synchronize
    paths:
      - "docker/**"

jobs:
  build-docker-images:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    steps:
      - name: Pull main repository
        uses: actions/checkout@v3
        with:
          repository: fortanix/salmiac

      - name: Build docker images
        run: |
          platforms=("nitro" "tdx")
          for platform in "${platforms[@]}"; do
            echo $platform
            SALMIAC_PLATFORM="${platform}" SKIP_ENCLAVE_BASE_GPU=true ./build-base-images.sh
          done
