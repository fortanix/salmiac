name: Build and publish Docker Images

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docker/**'
  pull_request:
    branches: [ "master" ]
    types:
      - closed
      - opened
      - synchronize
    paths:
      - 'docker/**'

jobs:
  build-docker-images:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    steps:
      - name: Pull main repository
        uses: actions/checkout@v3
        with:
          repository: fortanix/salmiac

      - name: Build docker images
        run: |
          docker build docker/enclave-base -t enclave-base
          docker build docker/snp/enclave-base-gpu -t enclave-base-snp-gpu
          docker build docker/nitro/parent-base -t parent-base-nitro
          docker build \
            --build-context parent-base=docker/nitro/parent-base \
            -t parent-base-snp \
            docker/snp/parent-base
          docker build \
            --build-context parent-base=docker/nitro/parent-base \
            -t parent-base-tdx \
            docker/tdx/parent-base
          docker rmi enclave-base enclave-base-snp-gpu parent-base-nitro parent-base-snp parent-base-tdx
