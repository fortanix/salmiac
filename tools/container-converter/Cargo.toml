[package]
name = "container-converter"
version = "0.1.0"
authors = ["Fortanix, Inc."]
edition = "2018"
license = "MPL-2.0"
repository = "https://github.com/fortanix/salmiac"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
api-model = { path = "../../api-model", features = ["serde"] }
async-process = "1.2.0"
async-trait = "0.1.51"
clap = "2.33"
docker-image-reference = "0.1.0"
env_logger = "0.7"
exitcode = "1.1.2"
# TODO: Remove branch once https://github.com/fortanix/rust-sgx/pull/931 is merged.
fortanix-vme-initramfs = "0.2"
futures = "0.3"
http = "0.2.8"
lazy_static = "1.4.0"
log = "0.4"
nix = { version = "0.26.1", features = ["user", "fs"] }
openssl = "0.10"
rand = "0.8.4"
serde = { version = "1.0.127", features = ["derive"] }
serde_json = { git = "https://github.com/fortanix/serde-json.git", branch = "base64_bytes" }
shiplift = { git = "https://github.com/fortanix/shiplift.git" }
sys-mount = "3.1.0"
tar = { git = "https://github.com/alexcrichton/tar-rs" }
tempfile = "3.2.0"
tokio = { version = "1.0.1", features = ["macros", "rt"] }
toml = "0.5.8"
url = "2.2.2"

[build-dependencies]
salmiac-build-support = { path = "../../build-support" }
walkdir = "2"
build-print = "0.1"

[dev-dependencies]
chrono = "0.4.22"

[lints.rust]
unexpected_cfgs = { level = "deny" }
